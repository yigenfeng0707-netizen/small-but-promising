name: Deploy to ModelScope Studio

# 借鉴 MedEvidence-AI 实战经验 + modelscope-studio-manager Skill
# 用 cookie 认证的私有 API（比 OpenAPI 更成熟稳定）
#
# 触发条件：推送到 main/master 分支，或手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ----------------------------------------------------------------------
      # 1. 拉取代码
      # ----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------------
      # 2. 创建创空间（首次运行时自动创建，后续跳过）
      #    用 OpenAPI（API Key 认证），借鉴 MedEvidence-AI 实战经验
      # ----------------------------------------------------------------------
      - name: Create Studio if not exists
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MS_OWNER: ${{ vars.MS_OWNER || 'gsym236998' }}
          MS_REPO: ${{ vars.MS_REPO_NAME || 'home-chem-safety-agent' }}
        run: |
          if [ -z "$MODELSCOPE_API_KEY" ]; then
            echo "::error::MODELSCOPE_API_KEY secret 未配置"
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://modelscope.cn/openapi/v1/studios/${MS_OWNER}/${MS_REPO}" \
            -H "Authorization: Bearer $MODELSCOPE_API_KEY")

          if [ "$STATUS" = "404" ]; then
            echo "🔧 创空间不存在，创建 $MS_OWNER/$MS_REPO ..."
            HTTP_CODE=$(curl -s -o /tmp/create.json -w "%{http_code}" -X POST \
              "https://modelscope.cn/openapi/v1/studios" \
              -H "Authorization: Bearer $MODELSCOPE_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "owner": "'"$MS_OWNER"'",
                "repo_name": "'"$MS_REPO"'",
                "sdk_type": "docker",
                "visibility": "public",
                "hardware": "platform/2v-cpu-16g-mem",
                "display_name": "安居智评 Agent"
              }')
            cat /tmp/create.json
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::创建创空间失败 (HTTP $HTTP_CODE)"
              exit 1
            fi
            echo "✅ 创空间创建成功，等待初始化..."
            sleep 20
          elif [ "$STATUS" = "200" ]; then
            echo "ℹ️ 创空间已存在"
          else
            echo "::error::查询创空间失败 (HTTP $STATUS)"
            exit 1
          fi

      # ----------------------------------------------------------------------
      # 3. 推送代码到魔搭创空间 Git 仓库（master 分支）
      #    魔搭默认分支是 master，GitHub 是 main，用 HEAD:master 映射
      # ----------------------------------------------------------------------
      - name: Push code to ModelScope
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MS_OWNER: ${{ vars.MS_OWNER || 'gsym236998' }}
          MS_REPO: ${{ vars.MS_REPO_NAME || 'home-chem-safety-agent' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MS_HOST="www.modelscope.cn"
          git remote add modelscope "https://oauth2:${MODELSCOPE_API_KEY}@${MS_HOST}/studios/${MS_OWNER}/${MS_REPO}.git"

          # 拉取远程 master 分支（首次为空时跳过）
          git fetch modelscope master || echo "远程为空，跳过 fetch"

          # 远程有内容时合并，冲突保留本地版本
          if git rev-parse --verify modelscope/master >/dev/null 2>&1; then
            echo "🔀 合并远程 master..."
            git merge modelscope/master --allow-unrelated-histories -m "Merge remote master" || {
              echo "⚠️ 合并冲突，保留本地版本"
              git checkout --ours .
              git add .
              git commit -m "Resolve conflicts, keep local version"
            }
          fi

          echo "📦 推送到魔搭 master 分支..."
          git push modelscope HEAD:master
          echo "✅ 代码推送完成"

      # ----------------------------------------------------------------------
      # 4. 触发部署（用 OpenAPI deploy 端点，支持首次部署和重新部署）
      #    实战经验：restart API 对首次部署/Empty 状态无效，必须用 deploy 端点
      # ----------------------------------------------------------------------
      - name: Deploy Studio
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MS_OWNER: ${{ vars.MS_OWNER || 'gsym236998' }}
          MS_REPO: ${{ vars.MS_REPO_NAME || 'home-chem-safety-agent' }}
        run: |
          echo "🚀 触发部署（OpenAPI deploy 端点）..."
          HTTP_CODE=$(curl -s -o /tmp/deploy.json -w "%{http_code}" -X POST \
            "https://modelscope.cn/openapi/v1/studios/${MS_OWNER}/${MS_REPO}/deploy" \
            -H "Authorization: Bearer $MODELSCOPE_API_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0")
          cat /tmp/deploy.json
          echo ""
          if [ "$HTTP_CODE" = "200" ]; then
            STATUS=$(cat /tmp/deploy.json | jq -r '.data.status // empty')
            echo "✅ 部署已触发，状态: $STATUS"
          else
            echo "::error::部署触发失败 (HTTP $HTTP_CODE)"
            exit 1
          fi

      # ----------------------------------------------------------------------
      # 5. 提示用户在创空间设置页配置环境变量
      #    （魔搭 API 不支持远程设置密文变量，必须网页手动配置，借鉴 MedEvidence-AI 经验）
      # ----------------------------------------------------------------------
      - name: Remind to configure env vars
        if: always()
        run: |
          echo "=========================================="
          echo "⚠️  重要：请在魔搭创空间设置页配置环境变量"
          echo "=========================================="
          echo "访问: https://www.modelscope.cn/studios/${{ vars.MS_OWNER || 'gsym236998' }}/${{ vars.MS_REPO_NAME || 'home-chem-safety-agent' }}/setting"
          echo ""
          echo "需要配置的【密文变量】（敏感信息）："
          echo "  - DASHSCOPE_API_KEY: 百炼业务空间 API Key（sk-ws-xxx）"
          echo "  - DASHSCOPE_API_BASE: https://llm-uarugoa0rqgduef5.cn-beijing.maas.aliyuncs.com/api/v1"
          echo ""
          echo "需要配置的【明文变量】（非敏感配置）："
          echo "  - PORT: 7860（与 Dockerfile 一致）"
          echo "  - QWEN3_MODEL: qwen-plus（可选，默认即此值）"
          echo "  - QWEN_VL_MODEL: qwen-vl-plus（可选，默认即此值）"
          echo ""
          echo "⚠️  业务空间 Key 必须配 DASHSCOPE_API_BASE，否则鉴权失败！"
          echo "=========================================="

      # ----------------------------------------------------------------------
      # 6. 监控部署状态（最多 15 分钟）
      # ----------------------------------------------------------------------
      - name: Monitor deployment
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MS_OWNER: ${{ vars.MS_OWNER || 'gsym236998' }}
          MS_REPO: ${{ vars.MS_REPO_NAME || 'home-chem-safety-agent' }}
        run: |
          echo "⏳ 等待 30 秒让构建启动..."
          sleep 30

          for i in $(seq 1 30); do
            echo ""
            echo "=== 第 $i/30 次检查 ==="

            STATUS=$(curl -s "https://modelscope.cn/openapi/v1/studios/${MS_OWNER}/${MS_REPO}" \
              -H "Authorization: Bearer $MODELSCOPE_API_KEY" \
              -H "User-Agent: Mozilla/5.0" | jq -r '.data.status // empty')
            echo "状态: $STATUS"

            if [ "$STATUS" = "Running" ]; then
              echo ""
              echo "✅✅✅ 部署成功！✅✅✅"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Error" ]; then
              echo "❌ 部署失败"
              exit 1
            fi

            sleep 30
          done

          echo "⚠️ 超时（15 分钟内未完成）"
          exit 1

      # ----------------------------------------------------------------------
      # 7. 健康检查 + 输出最终 URL
      # ----------------------------------------------------------------------
      - name: Health check and output URL
        if: always()
        env:
          MS_OWNER: ${{ vars.MS_OWNER || 'gsym236998' }}
          MS_REPO: ${{ vars.MS_REPO_NAME || 'home-chem-safety-agent' }}
        run: |
          # 魔搭创空间域名格式：https://{owner}-{repo}.ms.show
          SERVICE_URL="https://${MS_OWNER}-${MS_REPO}.ms.show"

          echo "=========================================="
          echo "🏠 安居智评 Agent 部署信息"
          echo "=========================================="
          echo "魔搭创空间页面: https://www.modelscope.cn/studios/${MS_OWNER}/${MS_REPO}"
          echo "服务 URL:       $SERVICE_URL"
          echo "健康检查:       $SERVICE_URL/health"
          echo "API 文档:       $SERVICE_URL/docs"
          echo "=========================================="

          # 健康检查（部署成功才检查）
          STATUS=$(curl -s "https://modelscope.cn/openapi/v1/studios/${MS_OWNER}/${MS_REPO}" \
            -H "Authorization: Bearer ${{ secrets.MODELSCOPE_API_KEY }}" \
            -H "User-Agent: Mozilla/5.0" | jq -r '.data.status // empty')
          if [ "$STATUS" = "Running" ]; then
            echo "🔍 健康检查..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ 健康检查通过"
            else
              echo "⚠️ 健康检查返回 $HTTP_CODE（服务可能还在启动中，稍后再试）"
            fi
          fi
